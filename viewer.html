<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Viewer · Ransomch.at</title>
    <meta name="robots" content="noindex,follow">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/viewer.css">
</head>
<body>
    <div class="viewer-shell">
        <!-- Sidebar: chat directory -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="./" class="logo">
                    <img src="./logo.png" alt="Ransomch.at logo">
                    <span class="logo-word">Ransomch<span class="logo-dot">.at</span></span>
                </a>
                <div class="search-wrap">
                    <input id="searchInput" class="search-input" type="search" placeholder="Filter groups & chats…" autocomplete="off" spellcheck="false">
                </div>
            </div>
            <div class="chat-list" id="groupList" role="tree" aria-label="Conversation directory">
                <div class="sidebar-empty">Loading conversations…</div>
            </div>
        </aside>

        <!-- Main chat pane -->
        <div class="chat-pane">
            <div class="topbar">
                <div class="topbar-info" id="topbarInfo">
                    <div class="topbar-title">Select a conversation</div>
                    <div class="topbar-meta">Browse the directory on the left, or open a direct chat link.</div>
                </div>
                <div class="topbar-actions">
                    <button id="copyLinkBtn" class="icon-btn" title="Copy direct link to this chat" disabled>
                        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10.6 13.4a1 1 0 0 0 1.4 1.4l3.2-3.2a3 3 0 0 0 0-4.24l-1.5-1.5a1 1 0 1 0-1.42 1.42l1.5 1.5a1 1 0 0 1 0 1.4l-3.14 3.22Zm2.8-2.8a1 1 0 0 0-1.4-1.4l-3.2 3.2a3 3 0 0 0 0 4.24l1.5 1.5a1 1 0 0 0 1.4-1.42l-1.5-1.5a1 1 0 0 1 0-1.4l3.2-3.22Z"/></svg>
                        <span>Copy link</span>
                    </button>
                    <nav class="topbar-nav">
                        <a href="./">Home</a>
                        <a href="./analysis.html">Analysis</a>
                        <a href="./about.html">About</a>
                    </nav>
                </div>
            </div>

            <div class="chat-content" id="chatContent">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <h3>Select a conversation</h3>
                    <p>Pick a group and chat from the directory on the left.<br>
                    Every conversation has a shareable direct link.</p>
                </div>
            </div>
        </div>
    </div>

    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle conversation directory">☰</button>

    <div id="toast" class="toast" role="status"></div>

    <script src="./assets/js/viewer.js"></script>
</body>
</html>
